name: update-data

on:
  schedule:
      - cron: "10 21 * * *"   # 06:10 KST
        workflow_dispatch:

        permissions:
          contents: write

          jobs:
            collect:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v4
                                - uses: actions/setup-python@v5
                                        with:
                                                  python-version: "3.11"
                                                        - name: 수집 (홈페이지 크롤링)
                                                                env:
                                                                          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
                                                                                  run: |
                                                                                            python3 scripts/fetch_contracts.py || true
                                                                                                      python3 scripts/detect_anomalies.py
                                                                                                            - name: 커밋
                                                                                                                    run: |
                                                                                                                              git config user.name "cartelwatch-bot"
                                                                                                                                        git config user.email "actions@users.noreply.github.com"
                                                                                                                                                  git add data
                                                                                                                                                            if git diff --quiet --cached; then
                                                                                                                                                                        echo "변경 없음"
                                                                                                                                                                                  else
                                                                                                                                                                                              git commit -m "data: daily update $(date -u +%Y-%m-%d)"
                                                                                                                                                                                                          git push
                                                                                                                                                                                                                    fi
                                                                                                                                                                                                                    
